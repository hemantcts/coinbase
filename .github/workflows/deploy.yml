name: Deploy to VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes trader tests
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      # Where the code lives on the server. Override with a repository variable APP_DIR if it moves.
      APP_DIR: ${{ vars.APP_DIR || '/home/loewenmut-coinbase/htdocs/coinbase.loewenmut.ch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy code to the server
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -rlptz --delete --no-owner --no-group \
            --exclude '.git' --exclude '.venv' --exclude '__pycache__' --exclude '.pytest_cache' \
            --include 'data/' --include 'data/history/' --include 'data/history/***' --exclude 'data/*' --exclude '.env' \
            --rsync-path='sudo rsync' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Run server setup and restart containers
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "sudo APP_DIR=$APP_DIR bash $APP_DIR/deploy/server-setup.sh"
