name: Server command
# Runs one operational command on the VPS over SSH and prints its output in the job log.
# Triggered by hand (Actions -> Server command -> Run workflow) or through the GitHub API.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to run on the server
        type: choice
        required: true
        default: status
        options:
          - status        # account state, last cycle, STOP/FLATTEN flags, gate status
          - gate          # release-gate checks (Phase A backtest + Phase B paper run)
          - logs          # last 150 lines of the trader log
          - events        # last 40 events from the database; put a kind in "value" (e.g. control, fill, halt) to filter
          - rotate-secrets # new random dashboard password + API token; read them on the server over SSH
          - containers    # docker compose ps + resource use
          - restart       # restart the trader container (state is restored from the database)
          - stop          # STOP: no new buys; exits keep working
          - resume        # clear STOP
          - flatten       # FLATTEN: sell everything at the next cycle, then STOP
          - backtest      # two-year backtest of the configured strategy and profile
          - set-env       # change one whitelisted .env key (needs key + value) and restart the trader
          - migrate       # one-time move of the app to the directory given in "value" (code, .env, data)
          - show-env      # print the .env with secrets masked
      key:
        description: "set-env only: RISK_PROFILE | STRATEGY | HALT_RESET_DAYS | FEE_RATE | TAKER_FEE_RATE | PRODUCTS | NOTIFY_WEBHOOK | MAX_DATA_AGE | DASHBOARD_BIND_PORT"
        required: false
        default: ""
      value:
        description: "set-env only: the new value"
        required: false
        default: ""

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ vars.APP_DIR || '/home/loewenmut-agent/htdocs/agent.loewenmut.ch' }}
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: "Run: ${{ inputs.action }}"
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT }}
          ACTION: ${{ inputs.action }}
          KEY: ${{ inputs.key }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$ACTION" in
            set-env)
              case "$KEY" in DASHBOARD_PASSWORD|DASHBOARD_VIEWER_PASSWORD|DASHBOARD_TOKEN|NOTIFY_WEBHOOK) echo "secrets are set on the server over SSH, not through GitHub: sudo bash deploy/set-env.sh $KEY '<value>'"; exit 1 ;; esac
              CMD="bash deploy/set-env.sh $KEY $VALUE" ;;
            migrate)    CMD="bash deploy/migrate.sh $APP_DIR ${VALUE:-/opt/trading-agent}" ;;
            show-env)   CMD="sed -E s/^\(DASHBOARD_TOKEN\|COINBASE_API_KEY\|COINBASE_API_SECRET\|NOTIFY_WEBHOOK\)=.+/\\1=***/ .env" ;;
            status)     CMD="docker compose exec -T trader python -m trader status" ;;
            gate)       CMD="docker compose exec -T trader python -m trader gate --days 730 || true" ;;
            logs)       CMD="docker compose logs --tail 150 --no-color trader" ;;
            events)     CMD="docker compose exec -T -e KIND=$VALUE trader python -c \"import os; from trader.store import Store; from trader.config import Settings; s=Settings.from_env(); k=os.environ.get('KIND') or None; [print(e['ts'], e['kind'], e['detail'][:220]) for e in reversed(Store(s.database).events(200 if k else 40, kind=k))]\"" ;;
            rotate-secrets) CMD="bash deploy/rotate-secrets.sh" ;;
            containers) CMD="docker compose ps && docker stats --no-stream" ;;
            restart)    CMD="docker compose restart trader && sleep 8 && docker compose logs --tail 10 --no-color trader" ;;
            stop)       CMD="docker compose exec -T trader python -m trader control stop" ;;
            resume)     CMD="docker compose exec -T trader python -m trader control resume" ;;
            flatten)    CMD="docker compose exec -T trader python -m trader control flatten" ;;
            backtest)   CMD="docker compose exec -T trader python -m trader backtest --days 730 --granularity 21600 --strategy trendhold --profile all" ;;
            *) echo "unknown action $ACTION"; exit 1 ;;
          esac
          echo "== $ACTION on $APP_DIR =="
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "cd '$APP_DIR' 2>/dev/null || sudo -n true; sudo bash -lc 'cd \"$APP_DIR\" && $CMD'"
