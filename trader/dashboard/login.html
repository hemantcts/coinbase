<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Login</title>
<style>
  :root { --bg:#f4f6fa; --panel:#fff; --panel-2:#f8fafc; --line:#e3e8ef; --text:#0f172a; --muted:#64748b; --accent:#2f6fed; --down:#d93f3f;
          --shadow:0 1px 2px rgba(15,23,42,.06), 0 12px 32px -18px rgba(15,23,42,.35); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b0e14; --panel:#121722; --panel-2:#171d2a; --line:#232b3a; --text:#e8ecf3; --muted:#8a94a8; --accent:#6b9cff; --down:#ff6b6b;
          --shadow:0 1px 0 rgba(255,255,255,.03), 0 16px 40px -24px rgba(0,0,0,.9); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; padding:16px; }
  .card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:28px 26px 22px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--accent),#8b5cf6); color:#fff; display:grid; place-items:center; font-weight:800; }
  h1 { font-size:18px; margin:0; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; background:var(--panel-2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; }
  input:focus { outline:2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color:var(--accent); }
  button { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px; font:inherit; font-weight:600; cursor:pointer; }
  .err { color:var(--down); font-size:13px; margin-top:12px; min-height:1.2em; }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:12px; color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { width:auto; margin:0; padding:4px 9px; border-radius:0; background:transparent; color:var(--muted); font-size:12px; font-weight:600; }
  .seg button.on { background:var(--accent); color:#fff; }
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="on">
  <div class="brand"><div class="logo">T</div><div><h1>Trading Agent</h1><div class="sub" data-i="sub">Privater Zugang</div></div></div>
  <label for="u" data-i="user">Benutzername</label>
  <input id="u" name="username" autocomplete="username" required autofocus>
  <label for="p" data-i="pass">Passwort</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="__NEXT__">
  <div class="err" id="err">__ERROR__</div>
  <button type="submit" data-i="btn">Anmelden</button>
  <div class="foot"><span data-i="note">Sitzung endet nach 12 Stunden.</span>
    <span class="seg"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button></span></div>
</form>
<script>
  const I = { de: { sub:"Privater Zugang", user:"Benutzername", pass:"Passwort", btn:"Anmelden", note:"Sitzung endet nach 12 Stunden.", bad:"Benutzername oder Passwort falsch.", locked:"Zu viele Versuche. Bitte später erneut versuchen." },
              en: { sub:"Private access", user:"Username", pass:"Password", btn:"Sign in", note:"Session ends after 12 hours.", bad:"Wrong username or password.", locked:"Too many attempts. Try again later." } };
  let lang = localStorage.getItem('lang') || 'de';
  const errCode = document.getElementById('err').textContent.trim();
  function apply() { document.documentElement.lang = lang; document.querySelectorAll('[data-i]').forEach(e => e.textContent = I[lang][e.dataset.i]);
    document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    document.getElementById('err').textContent = errCode === 'bad' ? I[lang].bad : errCode === 'locked' ? I[lang].locked : ''; }
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('lang', lang); apply(); });
  apply();
</script>
</body>
</html>
