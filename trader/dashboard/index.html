<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coinbase AI Trader</title>
<style>
  :root {
    --bg: #f4f6fa; --panel: #ffffff; --panel-2: #f8fafc; --line: #e3e8ef; --text: #0f172a; --muted: #64748b;
    --up: #0f9f6e; --down: #d93f3f; --warn: #c77d00; --accent: #2f6fed; --accent-soft: #e8f0ff;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -16px rgba(15,23,42,.25);
    --radius: 14px;
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14; --panel: #121722; --panel-2: #171d2a; --line: #232b3a; --text: #e8ecf3; --muted: #8a94a8;
    --up: #3ddc97; --down: #ff6b6b; --warn: #ffb547; --accent: #6b9cff; --accent-soft: #1a2540;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -20px rgba(0,0,0,.8);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b0e14; --panel: #121722; --panel-2: #171d2a; --line: #232b3a; --text: #e8ecf3; --muted: #8a94a8;
    --up: #3ddc97; --down: #ff6b6b; --warn: #ffb547; --accent: #6b9cff; --accent-soft: #1a2540;
    --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -20px rgba(0,0,0,.8);
  } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1400px; margin: 0 auto; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.01em; margin-right: 6px; }
  .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #8b5cf6); display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 800; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); white-space: nowrap; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--up); border-color: color-mix(in srgb, var(--up) 40%, transparent); background: color-mix(in srgb, var(--up) 10%, transparent); }
  .pill.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 40%, transparent); background: color-mix(in srgb, var(--down) 10%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .pill.info { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); background: var(--accent-soft); }
  .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .iconbtn { border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 10px; width: 34px; height: 32px; cursor: pointer; font-size: 15px; }
  .meta { font-size: 12.5px; color: var(--muted); }
  main { max-width: 1400px; margin: 0 auto; padding: 18px 20px 40px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; grid-column: span 12; }
  .card h2 { margin: 0 0 12px; font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .span4 { grid-column: span 4; } .span6 { grid-column: span 6; } .span8 { grid-column: span 8; }
  @media (max-width: 1000px) { .span4, .span6, .span8 { grid-column: span 12; } }
  .hero { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .hero { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 520px) { .hero { grid-template-columns: 1fr; } }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat .l { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stat .v.big { font-size: 34px; }
  .stat .s { font-size: 12.5px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .warnc { color: var(--warn); }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .mini { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
  .mini .l { font-size: 12px; color: var(--muted); } .mini .v { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .explain { display: flex; flex-direction: column; gap: 8px; }
  .sig { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
  .sig b { min-width: 76px; font-variant-numeric: tabular-nums; }
  .sig .r { color: var(--muted); font-size: 13.5px; }
  .chartwrap { position: relative; height: 260px; }
  canvas { width: 100%; height: 100%; display: block; }
  .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12.5px; box-shadow: var(--shadow); display: none; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll { overflow: auto; max-height: 360px; }
  .empty { color: var(--muted); font-size: 13.5px; padding: 6px 0; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--panel-2); border: 1px solid var(--line); }
  .tag.buy { color: var(--up); } .tag.sell { color: var(--down); }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 10px; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
  .btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .btn.danger { border-color: color-mix(in srgb, var(--down) 45%, transparent); color: var(--down); }
  .btn.ok { border-color: color-mix(in srgb, var(--up) 45%, transparent); color: var(--up); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .tokenrow { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  input[type=password], input[type=text] { flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; font: inherit; min-width: 0; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.45; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: var(--shadow); display: none; z-index: 10; }
  .banner { grid-column: span 12; border-radius: 12px; padding: 12px 16px; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); color: var(--text); display: none; }
  .card h2 { flex-wrap: wrap; }
  @media (max-width: 760px) { header { position: static; } .right { margin-left: 0; width: 100%; justify-content: space-between; } }
  @media (max-width: 640px) { main { padding: 12px; gap: 12px; } .bar { padding: 10px 12px; } .card { padding: 14px; } .stat .v.big { font-size: 28px; } .controls { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><div class="logo">C</div><span>Coinbase AI Trader</span></div>
    <div class="pills">
      <span class="pill" id="p-mode"><span class="dot"></span><span>…</span></span>

    </div>
    <div class="right">
      <span class="meta" id="meta"></span>
      <div class="seg" id="lang"><button data-lang="de">DE</button><button data-lang="en">EN</button></div>
      <button class="iconbtn" id="theme" title="Theme">◐</button>
    </div>
  </div>
</header>

<main>
  <div class="banner" id="banner"></div>

  <section class="card">
    <h2><span data-i="portfolio">Portfolio</span><span class="sub" id="fxnote"></span></h2>
    <div class="hero">
      <div class="stat"><div class="l" id="l-eq-rep">Equity (CHF)</div><div class="v big" id="v-eq-rep">–</div><div class="s" id="s-eq-rep"></div></div>
      <div class="stat"><div class="l" id="l-pnl">P&amp;L</div><div class="v" id="v-pnl">–</div><div class="s" id="s-pnl"></div></div>
      <div class="stat"><div class="l" id="l-cash">Cash</div><div class="v" id="v-cash">–</div><div class="s" id="s-cash"></div></div>
      <div class="stat"><div class="l" id="l-inv">Invested</div><div class="v" id="v-inv">–</div><div class="s" id="s-inv"></div></div>
    </div>
    <div class="grid3" style="margin-top:12px" id="minis"></div>
  </section>

  <section class="card span8">
    <h2><span data-i="equity">Equity</span><span class="sub" id="eqrange"></span></h2>
    <div class="chartwrap"><canvas id="chart"></canvas><div class="tip" id="tip"></div></div>
  </section>

  <section class="card span4">
    <h2 data-i="whatnow">What the bot is doing</h2>
    <div class="explain" id="explain"></div>
    <div class="note" id="explain-note"></div>
  </section>

  <section class="card span6">
    <h2 data-i="positions">Open positions</h2>
    <div class="scroll"><table id="positions"></table></div>
  </section>

  <section class="card span6">
    <h2 data-i="limits">Risk limits</h2>
    <div class="scroll"><table id="limits"></table></div>
  </section>

  <section class="card span4">
    <h2 data-i="controls">Emergency controls</h2>
    <div class="tokenrow"><input id="token" type="password" placeholder="Token" autocomplete="off"><button class="iconbtn" id="eye" title="show">👁</button></div>
    <div class="controls">
      <button class="btn danger" data-act="stop"><span data-i="b-stop">STOP new buys</span><small data-i="b-stop-s">exits keep working</small></button>
      <button class="btn ok" data-act="resume"><span data-i="b-resume">Resume</span><small data-i="b-resume-s">clear STOP</small></button>
      <button class="btn danger" data-act="flatten"><span data-i="b-flatten">FLATTEN</span><small data-i="b-flatten-s">sell everything, then STOP</small></button>
      <button class="btn danger" data-act="disarm"><span data-i="b-disarm">DISARM live</span><small data-i="b-disarm-s">remove the live arming</small></button>
    </div>
    <div class="note" data-i="controls-note"></div>
  </section>

  <section class="card span8">
    <h2 data-i="orders">Orders</h2>
    <div class="scroll"><table id="orders"></table></div>
  </section>

  <section class="card">
    <h2 data-i="events">Events</h2>
    <div class="scroll"><table id="events"></table></div>
  </section>
</main>
<div class="toast" id="toast"></div>

let CURVE = [], INITIAL = 0;

async function control(action) {
